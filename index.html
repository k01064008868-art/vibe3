<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="우리반 친구들과 함께 재미있는 영상 아이디어를 찾고 만들어 보는 서비스" />
    <title>우리반 친구들 영상만들기</title>
    <style>
      :root {
        font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
        color: #4b302b;
        background: #fff8ef;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 8% 12%, rgba(255, 188, 164, .7), transparent 24rem),
          radial-gradient(circle at 92% 18%, rgba(255, 222, 137, .7), transparent 22rem),
          linear-gradient(150deg, #fff8ef 0%, #fff2e6 50%, #fffaf2 100%);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 220px;
        height: 220px;
        border-radius: 42% 58% 67% 33% / 45% 35% 65% 55%;
        content: "";
        opacity: .45;
      }

      body::before {
        right: -70px;
        bottom: -40px;
        background: #ffb596;
        transform: rotate(22deg);
      }

      body::after {
        bottom: 8%;
        left: -90px;
        background: #ffd778;
        transform: rotate(-18deg);
      }

      .page {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        letter-spacing: -.04em;
      }

      .logo-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 15px;
        background: #ff7f66;
        box-shadow: 0 8px 20px rgba(219, 89, 66, .22);
        color: #fff;
      }

      .audience {
        margin: 0;
        padding: 8px 13px;
        border: 1px solid rgba(125, 69, 48, .12);
        border-radius: 999px;
        background: rgba(255, 255, 255, .65);
        color: #8b5648;
        font-size: 13px;
        font-weight: 800;
      }

      main {
        display: grid;
        min-height: calc(100vh - 118px);
        align-content: center;
        padding: 56px 0;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(360px, .95fr);
        align-items: center;
        gap: clamp(40px, 8vw, 100px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 18px;
        color: #e85f46;
        font-size: 15px;
        font-weight: 900;
      }

      .eyebrow::before {
        width: 27px;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 720px;
        margin: 0;
        color: #432823;
        font-size: clamp(48px, 7vw, 84px);
        font-weight: 950;
        line-height: 1.05;
        letter-spacing: -.07em;
        text-wrap: balance;
      }

      .intro {
        max-width: 590px;
        margin: 24px 0 0;
        color: #8a5c50;
        font-size: clamp(18px, 2.3vw, 24px);
        font-weight: 700;
        line-height: 1.55;
        letter-spacing: -.03em;
      }

      .cta {
        display: inline-flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 34px;
        padding: 0 28px;
        border-radius: 18px;
        background: #ef684f;
        box-shadow: 0 14px 28px rgba(209, 82, 59, .25);
        color: #fff;
        font-size: 17px;
        font-weight: 900;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .cta:hover {
        box-shadow: 0 18px 34px rgba(209, 82, 59, .32);
        transform: translateY(-3px);
      }

      .cta:focus-visible {
        outline: 4px solid rgba(239, 104, 79, .25);
        outline-offset: 4px;
      }

      .idea-cards {
        display: grid;
        gap: 15px;
        padding: clamp(20px, 4vw, 34px);
        border: 1px solid rgba(125, 69, 48, .12);
        border-radius: 34px;
        background: rgba(255, 255, 255, .72);
        box-shadow: 0 24px 70px rgba(127, 76, 48, .14);
        backdrop-filter: blur(16px);
        transform: rotate(1.4deg);
      }

      .card-title {
        margin: 0 0 5px;
        color: #6f4237;
        font-size: 14px;
        font-weight: 900;
      }

      .idea-card {
        display: grid;
        grid-template-columns: 52px 1fr;
        align-items: center;
        gap: 15px;
        padding: 17px;
        border-radius: 22px;
        background: #fffaf5;
        box-shadow: inset 0 0 0 1px rgba(125, 69, 48, .08);
        transform: rotate(-1.4deg);
      }

      .idea-card:nth-of-type(2) { background: #fff3da; }
      .idea-card:nth-of-type(3) { background: #ffe9e1; }

      .icon {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border-radius: 17px;
        background: #ffdd9a;
        font-size: 25px;
      }

      .idea-card strong {
        display: block;
        margin-bottom: 4px;
        color: #52342d;
        font-size: 17px;
        letter-spacing: -.03em;
      }

      .idea-card p {
        margin: 0;
        color: #95695e;
        font-size: 14px;
        line-height: 1.5;
      }

      @media (max-width: 820px) {
        .page { width: min(100% - 28px, 680px); padding-top: 18px; }
        main { min-height: auto; padding: 58px 0 32px; }
        .hero { grid-template-columns: 1fr; gap: 46px; }
        .hero-copy { text-align: center; }
        .eyebrow { justify-content: center; }
        h1, .intro { margin-right: auto; margin-left: auto; }
        .idea-cards { width: min(100%, 560px); margin: 0 auto; transform: none; }
        .idea-card { transform: none; }
      }

      @media (max-width: 480px) {
        .logo { font-size: 14px; }
        .logo-mark { width: 38px; height: 38px; border-radius: 13px; }
        .audience { font-size: 12px; }
        main { padding-top: 48px; }
        h1 { font-size: clamp(42px, 14vw, 58px); }
        .intro { font-size: 18px; }
        .cta { width: 100%; }
        .idea-cards { padding: 18px; border-radius: 26px; }
        .idea-card { grid-template-columns: 46px 1fr; padding: 14px; }
        .icon { width: 46px; height: 46px; border-radius: 15px; font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo"><span class="logo-mark" aria-hidden="true">▶</span>우리반 스튜디오</div>
        <p class="audience">10대를 위한 영상 놀이터</p>
      </header>

      <main>
        <section class="hero" aria-labelledby="service-title">
          <div class="hero-copy">
            <p class="eyebrow">친구들과 시작하는 즐거운 프로젝트</p>
            <h1 id="service-title">우리반 친구들 영상만들기</h1>
            <p class="intro">우리반 친구들과 함께 할 아이디어 찾기</p>
            <a class="cta" href="#ideas">둘러보기 <span aria-hidden="true">→</span></a>
          </div>

          <div class="idea-cards" id="ideas">
            <p class="card-title">우리끼리 이렇게 만들어 봐!</p>
            <article class="idea-card">
              <div class="icon" aria-hidden="true">💡</div>
              <div><strong>재미있는 아이디어 발견</strong><p>우리 반만의 이야기와 유행을 영상 주제로 바꿔 봐요.</p></div>
            </article>
            <article class="idea-card">
              <div class="icon" aria-hidden="true">🤝</div>
              <div><strong>친구들과 역할 나누기</strong><p>감독, 배우, 촬영 담당을 정하고 함께 완성해 봐요.</p></div>
            </article>
            <article class="idea-card">
              <div class="icon" aria-hidden="true">🎬</div>
              <div><strong>우리만의 영상 완성</strong><p>웃음과 추억이 담긴 멋진 작품을 직접 만들어 봐요.</p></div>
            </article>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
