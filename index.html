<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="vibe3 프로젝트 홈페이지" />
    <title>vibe3</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Pretendard, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b14;
        color: #f7f8fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(108, 92, 231, .38), transparent 34rem),
          radial-gradient(circle at 80% 70%, rgba(0, 210, 211, .24), transparent 30rem),
          #080b14;
      }

      main {
        width: min(720px, calc(100% - 40px));
        padding: clamp(36px, 8vw, 72px);
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 28px;
        background: rgba(255, 255, 255, .07);
        box-shadow: 0 30px 90px rgba(0, 0, 0, .38);
        backdrop-filter: blur(20px);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .1);
        color: #c9fff7;
        font-size: 14px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2de2c5;
        box-shadow: 0 0 18px #2de2c5;
      }

      h1 {
        margin: 24px 0 14px;
        font-size: clamp(56px, 14vw, 108px);
        line-height: .9;
        letter-spacing: -.07em;
      }

      p {
        margin: 0 auto;
        max-width: 480px;
        color: #b9bfd0;
        font-size: clamp(17px, 3vw, 21px);
        line-height: 1.7;
      }

      strong { color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge"><span class="dot"></span> Now live</div>
      <h1>vibe3</h1>
      <p><strong>새로운 프로젝트가 시작되었습니다.</strong><br />이 페이지를 자유롭게 바꾸고 확장해 보세요.</p>
    </main>
  </body>
</html>
